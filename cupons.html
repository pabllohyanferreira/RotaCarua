<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#002048">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rota Caruá">
    <title>Cupons - ROTA CARUÁ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icone-192.png">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="img/logo-rota-carua.jpg" alt="Rota Caruá">
        </a>

        <nav class="navigation">
            <a href="index.html">Explorar</a>
            <a href="roteiro.html">Meu roteiro</a>
            <a href="cupons.html" class="active">Cupons</a>
        </nav>

        <div class="header-actions">
            <span id="nome-usuario" class="user-name" hidden></span>
            <button type="button" id="btn-sair" class="btn btn-login" hidden>Sair</button>
            <a href="login.html" id="btn-entrar-header" class="btn btn-login">Entrar</a>
        </div>
    </header>

    <main class="pagina-cupons">
        <section class="auth-section pagina-interna">
            <div class="auth-container caixa-larga">
                <span class="section-tag">SEUS BENEFICIOS</span>
                <h2>Meus cupons</h2>
                <p>Cupons gerados no app. Mostre o codigo no comercio parceiro.</p>
                <div id="lista-cupons">
                    <p>Carregando...</p>
                </div>
            </div>
        </section>

        <section class="auth-section pagina-interna" id="bloco-validacao" hidden>
            <div class="auth-container caixa-larga">
                <span class="section-tag">COMERCIO</span>
                <h2>Validar cupom</h2>
                <p>Digite o codigo que o cliente apresentar.</p>

                <form id="form-validacao">
                    <div class="form-group">
                        <label for="campo-codigo">Codigo do cupom</label>
                        <input id="campo-codigo" type="text" required placeholder="Ex: RC-AB12CD" maxlength="20" style="text-transform: uppercase;">
                    </div>
                    <button type="submit" class="btn btn-primary">Validar e registrar</button>
                </form>

                <p id="msg-validacao" class="msg-info" hidden></p>
                <div id="resultado-validacao"></div>
            </div>
        </section>
    </main>

    <nav class="nav-mobile" aria-label="Menu principal">
        <a href="index.html" class="nav-mobile-item">Explorar</a>
        <a href="roteiro.html" class="nav-mobile-item">Roteiro</a>
        <a href="cupons.html" class="nav-mobile-item active">Cupons</a>
    </nav>

    <footer class="footer footer-mobile-safe">
        <div class="footer-bottom">
            <p>© 2026 ROTA CARUÁ</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cupons.js"></script>
    <script src="js/cupons-pagina.js"></script>
</body>

</html>
