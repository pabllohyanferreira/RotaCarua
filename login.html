<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#002048">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rota Caruá">
    <title>Login - ROTA CARUÁ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icone-192.png">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="img/logo-rota-carua.jpg" alt="Rota Caruá">
        </a>
        <div class="header-actions">
            <div class="seletor-idioma" role="group" data-i18n-aria="idioma" aria-label="Idioma">
                <button type="button" class="btn-lang" data-lang="pt" aria-pressed="true">PT</button>
                <button type="button" class="btn-lang" data-lang="en" aria-pressed="false">EN</button>
                <button type="button" class="btn-lang" data-lang="es" aria-pressed="false">ES</button>
            </div>
            <a href="login.html" class="btn btn-login active" data-i18n="btn_entrar">Entrar</a>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <img src="img/logo-rota-carua.jpg" alt="Rota Caruá" class="logo-auth">
                <span class="section-tag" data-i18n="login_tag">BEM-VINDO DE VOLTA</span>
                <h2 data-i18n="login_titulo">Entre na sua conta</h2>
                <p data-i18n="login_intro">Acesse sua conta para montar roteiros e aproveitar benefícios.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" data-i18n="btn_entrar">Entrar</button>
                </form>

                <p class="auth-link">
                    Ainda não possui uma conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>
                <p class="auth-link">Demo: usuario@gmail.com / 123456</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p data-i18n="footer_copy">© 2026 ROTA CARUÁ. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = async function (e) {
            e.preventDefault();
            var ok = await fazerLogin(
                document.getElementById('email').value,
                document.getElementById('password').value
            );
            if (!ok) return;

            var params = new URLSearchParams(window.location.search);
            var next = params.get('next') || 'index.html';
            window.location.href = next;
        };

        document.querySelector('.logo').href = 'index.html';

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(function (reg) {
                reg.update();
            });
        }
    </script>
</body>

</html>
